[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "CP4ConfigShift"
version = "0.1.0"
description = "Conformal prediction for LLMs under configuration shift: collect scores, calibrate, and evaluate across prompts, decoding settings and quantization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6",
    "tqdm>=4",
]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.51", "accelerate>=0.28"]
gguf = ["llama-cpp-python>=0.3"]
api = ["openai>=1.0"]
embed = ["sentence-transformers>=2.6"]
dev = ["pytest>=7"]

[project.scripts]
cp4cs = "cp4configshift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cp4configshift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
