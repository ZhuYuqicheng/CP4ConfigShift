  formal:
    description: "Formal/instruction style with dot-format choices"
    choice_style: dot_upper
    prompt: |-
      You are an expert in {subject} with deep domain knowledge and strong analytical reasoning abilities. 
      Your task is to answer a multiple-choice question in the field of {subject} by selecting the single most correct option from the provided choices.

      Below is an example demonstrating the expected question format and the expected answer format. Use it as a reference for how to structure your response.
      Example:
      Question: {demo_question}
      Options: {demo_choices}
      Answer: {demo_answer}

      Now, using the same reasoning approach and output format demonstrated above, please answer the following multiple-choice question in the field of {subject}.

      Question: {question}
      Options: {choices}
      Answers:

  minimal:
